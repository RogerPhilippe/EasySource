<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>EasySource</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="tabbar">
      <div id="tabs"></div>
      <button id="tab-add" title="Repository browser (Ctrl+B)">+</button>
    </header>
    <main id="content"></main>
    <section id="cmdlog" class="hidden">
      <div class="cmdlog-head"><span>Command history</span><button id="cmdlog-clear">Clear</button><button id="cmdlog-close">×</button></div>
      <pre id="cmdlog-body"></pre>
    </section>
    <footer id="statusbar">
      <span id="status-left"></span>
      <span id="status-busy" class="hidden"><i class="spinner"></i><span id="status-busy-text"></span></span>
      <span id="status-right"></span>
      <button id="theme-toggle" title="Switch theme"></button>
    </footer>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
